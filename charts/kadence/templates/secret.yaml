{{- /* D6: when secrets.existingSecret is set, the operator owns that Secret
       entirely — render none of our own (see values.yaml's secrets.existingSecret
       comment for what it must then contain). */}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kadence.fullname" . }}-secret
  labels:
    {{- include "kadence.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Same falsy-value fix as configmap.yaml: only drop unset-optional
         empty strings, never a genuine false/0 override. existingSecret
         itself is excluded — it's a chart control key, not an app env var. */}}
  {{- range $key, $value := .Values.secrets }}
  {{- if and (ne $key "existingSecret") (or (ne (kindOf $value) "string") (ne $value "")) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required when postgres.enabled" .Values.postgres.password | quote }}
  {{- else if and (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.url }}
  KADENCE_DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}
