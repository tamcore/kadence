{{- if and .Values.garmin.enabled .Values.garmin.ingress.enabled }}
{{- $fullname := include "kadence.garmin.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "kadence.labels" . | nindent 4 }}
    app.kubernetes.io/component: garmin
  {{- $csp := "" }}
  {{- if .Values.garmin.ingress.relaxFormActionCSP }}
  {{- $csp = printf "default-src 'none'; style-src 'self'; form-action 'self' https://%s; base-uri 'none'; frame-ancestors 'none'" .Values.ingress.host }}
  {{- end }}
  {{- if or .Values.garmin.ingress.annotations $csp }}
  annotations:
    {{- with .Values.garmin.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $csp }}
    # UPSTREAM WORKAROUND (KADENCE-009, re-opened as KADENCE-010 — v0.0.6
    # added the origin to the consent POST's response, which the browser never
    # reads, so the block persists). garmin-mcp sends `form-action 'self'`,
    # and Chrome applies form-action across a form submission's whole redirect
    # chain. The consent POST answers with a cross-origin 303 to this app's
    # callback, so Chrome blocks the hop: the grant is minted and the code
    # never arrives. Adding only this app's own origin keeps the directive
    # strict. Delete this and the value once a release carries the origin on
    # the GET that renders the consent form — that response's policy is the one
    # the browser enforces the submission against.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers "Content-Security-Policy";
      more_set_headers "Content-Security-Policy: {{ $csp }}";
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.garmin.ingress.className }}
  {{- if .Values.garmin.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.garmin.host }}
    secretName: {{ $fullname }}-tls
  {{- end }}
  rules:
  - host: {{ .Values.garmin.host }}
    http:
      paths:
      # The whole host, unrewritten. garmin-mcp fixes /authorize, /login,
      # /token, /revoke and both .well-known documents at the origin root and
      # derives its issuer from the public URL, so a rewritten or partial path
      # breaks discovery rather than merely moving it.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $fullname }}
            port:
              name: http
{{- end }}
