{{- if and .Values.markitdown.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kadence.markitdown.fullname" . }}
  labels:
    {{- include "kadence.labels" . | nindent 4 }}
    app.kubernetes.io/component: markitdown
spec:
  podSelector:
    matchLabels:
      {{- include "kadence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: markitdown
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "kadence.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: app
    ports:
    - protocol: TCP
      port: 8080
  egress:
  {{- include "kadence.netpol.dnsEgress" . | nindent 2 }}
  {{- include "kadence.netpol.httpsEgress" . | nindent 2 }}
{{- end }}
