apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kadence.fullname" . }}
  labels:
    {{- include "kadence.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kadence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        # Config and secrets reach the container as environment variables,
        # which are read once at start. Without this the pod keeps serving the
        # old values after a chart upgrade changes them — the rollout reports
        # success and nothing restarts, so a changed model, endpoint or key
        # silently does not take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "kadence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kadence.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
      - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
        labelSelector:
          matchLabels:
            {{- include "kadence.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: app
      # Soft (preferred, not required) pod anti-affinity alongside the spread
      # constraint above: same "don't crowd a single node, but never block
      # scheduling" intent, using the mechanism kube-linter's no-anti-affinity
      # check specifically looks for.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "kadence.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: app
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 310 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: wait-for-db
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/kadence", "wait-for-db"]
        env:
        {{- include "kadence.dbEnv" . | nindent 8 }}
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
      containers:
      - name: kadence
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.ports.http }}
          name: http
        - containerPort: {{ .Values.ports.health }}
          name: health
        env:
        {{- include "kadence.dbEnv" . | nindent 8 }}
        {{- range $fitRouteIndex, $server := .Values.mcp.servers }}
        {{- $prefix := include "kadence.mcp.envPrefix" (dict "root" $ "server" $server) }}
        {{- $svc := include "kadence.mcp.fullname" (dict "root" $ "server" $server) }}
        {{- $secret := $.Values.mcp.basicAuth.existingSecret | default (include "kadence.mcp.authSecretName" $) }}
        {{- $scheme := ternary "https" "http" $.Values.mcp.tls.enabled }}
        - name: {{ $prefix }}_URL
          value: {{ printf "%s://%s:8080%s" $scheme $svc ($server.path | default "/mcp") | quote }}
        - name: {{ $prefix }}_TRANSPORT
          value: {{ $server.transport | default "streamable-http" | quote }}
        - name: {{ $prefix }}_AUTH_USER
          valueFrom: { secretKeyRef: { name: {{ $secret }}, key: username } }
        - name: {{ $prefix }}_AUTH_PASS
          valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } }
        {{- with $server.tools }}
        - name: {{ $prefix }}_TOOLS
          value: {{ join "," . | quote }}
        {{- end }}
        {{- with $server.alias }}
        - name: {{ $prefix }}_ALIAS
          value: {{ . | quote }}
        {{- end }}
        {{- with $server.hint }}
        - name: {{ $prefix }}_HINT
          value: {{ . | quote }}
        {{- end }}
        {{- if and $server.fitAnalysis $server.fitAnalysis.enabled }}
        {{- $fitRoutePrefix := printf "KADENCE_FIT_ROUTE_%d" $fitRouteIndex }}
        - name: {{ $fitRoutePrefix }}_SERVER_NAME
          value: {{ upper $server.name | quote }}
        - name: {{ $fitRoutePrefix }}_SERVER_SCOPE
          value: {{ include "kadence.mcp.scopeToken" (dict "root" $ "server" $server) | quote }}
        - name: {{ $fitRoutePrefix }}_DOWNLOAD_TOOL
          value: {{ $server.fitAnalysis.downloadTool | quote }}
        - name: {{ $fitRoutePrefix }}_BRIDGE_URL
          value: {{ printf "http://%s:8081" $svc | quote }}
        - name: {{ $fitRoutePrefix }}_BRIDGE_AUTH_USER
          valueFrom: { secretKeyRef: { name: {{ $secret }}, key: username } }
        - name: {{ $fitRoutePrefix }}_BRIDGE_AUTH_PASS
          valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } }
        {{- end }}
        {{- end }}
        {{- if .Values.garmin.enabled }}
        {{- $garminURL := include "kadence.garmin.publicURL" . }}
        # Reached at its public URL rather than through the cluster Service: the
        # tokens are minted for that exact resource, and the TLS certificate is
        # issued for that host.
        - name: MCP_GARMIN_GLOBAL_URL
          value: {{ $garminURL | quote }}
        - name: MCP_GARMIN_GLOBAL_TRANSPORT
          value: "streamable-http"
        - name: MCP_GARMIN_GLOBAL_AUTH_MODE
          value: "oauth"
        - name: MCP_GARMIN_GLOBAL_OAUTH_CLIENT_ID
          value: {{ .Values.garmin.oauth.clientID | quote }}
        - name: MCP_GARMIN_GLOBAL_OAUTH_RESOURCE
          value: {{ $garminURL | quote }}
        - name: MCP_GARMIN_GLOBAL_OAUTH_SCOPES
          value: {{ join "," .Values.garmin.oauth.scopes | quote }}
        {{- with .Values.garmin.tools }}
        - name: MCP_GARMIN_GLOBAL_TOOLS
          value: {{ join "," . | quote }}
        {{- end }}
        {{- with .Values.garmin.hint }}
        - name: MCP_GARMIN_GLOBAL_HINT
          value: {{ . | quote }}
        {{- end }}
        # The redirect URI is built from this by concatenation and must equal
        # the one registered with the authorization server byte for byte.
        - name: KADENCE_PUBLIC_URL
          value: {{ printf "https://%s" .Values.ingress.host | quote }}
        {{- end }}
        {{- if .Values.markitdown.enabled }}
        {{- $mdSvc := include "kadence.markitdown.fullname" . }}
        {{- $mdSecret := include "kadence.markitdown.authSecretName" . }}
        {{- $mdScheme := ternary "https" "http" .Values.mcp.tls.enabled }}
        - name: KADENCE_MARKITDOWN_URL
          value: {{ printf "%s://%s:8080%s" $mdScheme $mdSvc .Values.markitdown.path | quote }}
        - name: KADENCE_MARKITDOWN_TRANSPORT
          value: "streamable-http"
        - name: KADENCE_MARKITDOWN_AUTH_USER
          valueFrom: { secretKeyRef: { name: {{ $mdSecret }}, key: username } }
        - name: KADENCE_MARKITDOWN_AUTH_PASS
          valueFrom: { secretKeyRef: { name: {{ $mdSecret }}, key: password } }
        {{- end }}
        {{- if include "kadence.mcp.caSecretRef" . }}
        - name: KADENCE_MCP_CA_FILE
          value: /etc/kadence/mcp-ca/ca.crt
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "kadence.fullname" . }}-config
        - secretRef:
            name: {{ include "kadence.appSecretName" . }}
        # Generous ~300s budget (periodSeconds * failureThreshold) absorbs a
        # slow first boot (migrations + reindex) so it can't crash-loop
        # against livenessProbe's initialDelaySeconds: 30. While this probe
        # hasn't yet succeeded, liveness/readiness are not evaluated.
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml (.Values.resources | default dict) | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if include "kadence.mcp.caSecretRef" . }}
        - name: mcp-ca
          mountPath: /etc/kadence/mcp-ca/ca.crt
          subPath: ca.crt
          readOnly: true
        {{- end }}
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: {{ .Values.tmpSizeLimit }}
      {{- with include "kadence.mcp.caSecretRef" . }}
      {{- $caRef := splitList "/" . }}
      - name: mcp-ca
        secret:
          secretName: {{ index $caRef 0 }}
          items:
          - key: {{ index $caRef 1 }}
            path: ca.crt
      {{- end }}
