{{- if .Values.networkPolicy.enabled }}
{{- $fitAnalysisEnabled := false }}
{{- range .Values.mcp.servers }}
{{- if and .fitAnalysis .fitAnalysis.enabled }}
{{- $fitAnalysisEnabled = true }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kadence.fullname" . }}
  labels:
    {{- include "kadence.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  podSelector:
    matchLabels:
      {{- include "kadence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 8 }}
    ports:
    - protocol: TCP
      port: {{ .Values.ports.http }}
  egress:
  {{- if .Values.postgres.enabled }}
  - to:
    - podSelector:
        matchLabels:
          {{- include "kadence.postgres.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 5432
  {{- end }}
  - to:
    - podSelector:
        matchLabels:
          {{- include "kadence.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: mcp
    ports:
    - protocol: TCP
      port: 8080
    {{- if $fitAnalysisEnabled }}
    - protocol: TCP
      port: 8081
    {{- end }}
  {{- if .Values.markitdown.enabled }}
  - to:
    - podSelector:
        matchLabels:
          {{- include "kadence.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: markitdown
    ports:
    - protocol: TCP
      port: 8080
  {{- end }}
  {{- include "kadence.netpol.dnsEgress" . | nindent 2 }}
  {{- include "kadence.netpol.httpsEgress" . | nindent 2 }}
  {{- if .Values.garmin.enabled }}
  # The app reaches garmin-mcp at its public URL, because that is the audience
  # its tokens are minted for and the host its certificate is issued for. That
  # request hairpins through this cluster's own ingress, and the hairpin is
  # DNATed to the controller's POD address before egress policy is evaluated —
  # a private address the httpsEgress rule above deliberately excludes. Without
  # this rule the call is denied and every discovery attempt times out.
  - to:
    - namespaceSelector:
        {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 8 }}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  {{- end }}
  {{- with .Values.networkPolicy.extraAppEgress }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
