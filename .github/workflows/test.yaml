name: Tests

on:
  push:
    # Every branch, not just master: a feature branch otherwise gets no CI
    # at all until a pull request exists. The concurrency block below
    # cancels superseded runs, so the cost of this is bounded.
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.13.1
      - name: Test + coverage (single run, all packages)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage gate (internal/... >= 70%)
        # Filters the single full-suite profile down to internal/ entries
        # instead of re-running the testcontainer-backed internal/... suite
        # a second time. go tool cover -func recomputes the weighted total
        # from the filtered statement counts, so this is numerically
        # identical to running coverage on ./internal/... alone.
        run: |
          awk '/^mode: / || /\/internal\// {print}' coverage.out > coverage-internal.out
          pct=$(go tool cover -func=coverage-internal.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "internal coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 70) ? 0 : 1 }'

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
