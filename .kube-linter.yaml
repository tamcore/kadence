# kube-linter config — see .github/workflows/chart.yaml, job "kube-linter".
# This job is BLOCKING: kube-linter's default check bundle runs against every
# rendered combo (default values, values-dev.yaml.example, an mcp+markitdown
# combo (garmin), and a postgres+markitdown+mcp(garmin,cloakbrowser)
# NetworkPolicy combo rendered with networkPolicy.defaultDeny both false and
# true — see chart.yaml's lint-and-template and kube-linter jobs for the
# exact commands), and any finding fails CI unless explicitly excluded below.
#
# Only one check is excluded, and only for a documented reason:
#   - no-read-only-root-fs: fires on the postgres StatefulSet's "postgres"
#     container and on the mcp/markitdown Deployments' upstream containers.
#     These are 3rd-party images (pgvector/pgvector, garmin-mcp,
#     cloakbrowser-mcp, mcp/markitdown) that write to their own filesystem
#     (Postgres data/WAL, garmin token cache, markitdown temp files); left
#     read-write on purpose. The nginx sidecar in the mcp/markitdown pods IS
#     read-only-root-fs.
#
# Every other finding previously documented here as advisory
# (pdb-unhealthy-pod-eviction-policy, no-anti-affinity,
# unset-memory-requirements, latest-tag) has since been fixed in the chart
# and values defaults and is expected to stay clear. If a new finding
# appears, fix it — do not add another exclude here without the same level
# of written justification as above.
#
# run-as-non-root and unset-cpu-requirements on the mcp/nginx containers were
# fixed by giving both containers a pod-level securityContext
# (runAsNonRoot/runAsUser/runAsGroup/fsGroup 65532 + seccompProfile
# RuntimeDefault, override via per-server `securityContext`) and default
# resource requests (mcp.resources, mcp.nginx.resources,
# markitdown.nginx.resources).
checks:
  doNotAutoAddDefaults: false
  exclude:
  - no-read-only-root-fs
